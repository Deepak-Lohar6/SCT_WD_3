<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — DevAcademy</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="brand"><span class="brand-badge">&lt;/&gt;</span> DevAcademy</a>
        </div>
    </header>

    <main class="content-body">
        <div class="auth-card">
            <h2>Reset Password</h2>
            <p class="auth-sub">Enter your email to reset your credentials</p>
            <form id="forgotForm">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="forgotEmail" required placeholder="student@example.com">
                </div>
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" id="forgotNewPassword" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Update Password</button>
            </form>
            <p class="auth-footer"><a href="login.html">Return to Login</a></p>
        </div>
    </main>

    <script src="forgot-password.js"></script>
</body>
</html>
