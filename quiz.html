<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessment — DevAcademy</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="nav-container">
            <a href="dashboard.html" class="brand"><span class="brand-badge">&lt;/&gt;</span> DevAcademy</a>
        </div>
    </header>

    <main class="content-body">
        <div class="quiz-container">
            <div class="quiz-header">
                <div>
                    <span class="quiz-tag">Question <span id="quizCurrentIndex">1</span> of 15</span>
                    <h2>Web Development Assessment</h2>
                </div>
                <div class="timer-box">
                    <span class="timer-label">Time Remaining</span>
                    <span id="timerDisplay" class="timer-value">30:00</span>
                </div>
            </div>

            <div class="quiz-progress">
                <div class="quiz-progress-bar" id="quizProgressBar"></div>
            </div>

            <div class="quiz-body">
                <h3 id="questionText" class="question-text">Loading question...</h3>
                <div id="optionsContainer" class="options-container"></div>
            </div>

            <div class="quiz-footer">
                <button class="btn btn-outline" id="prevBtn">Previous</button>
                <button class="btn btn-primary" id="nextBtn">Next</button>
                <button class="btn btn-success" id="submitBtn">Submit Quiz</button>
            </div>
        </div>
    </main>

    <script src="questions.js"></script>
    <script src="quiz.js"></script>
</body>
</html>
